<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Automation Hub</title>
<link rel="icon" type="image/png" href="https://terratern.com/images/favicon.png"/>
<link rel="stylesheet" href="/shell.css"/>
<script src="/shell.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#00215C;--blue:#255CC1;--bg:#f0f4fb;--surface:#fff;--border:#dde6f5;--text:#00215C;--muted:#5a7ab5;--green:#1a9e5c;--font:'Inter',system-ui,sans-serif}
[data-theme='dark']{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--navy:#0f172a}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;transition:background .2s}
.page{padding:32px 24px;max-width:960px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:8px;height:8px;border:1.5px solid rgba(90,122,181,.3);border-top-color:var(--muted);border-radius:50%;animation:spin .7s linear infinite}

.section-title{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.stat-tile{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px}
.stat-tile .tv{font-size:22px;font-weight:800;color:var(--navy)}
.stat-tile .tl{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:4px}
.stat-tile .td{font-size:10px;font-weight:700;margin-top:6px}
.stat-tile .td.up{color:var(--green)}
.stat-tile .td.flat{color:var(--muted)}
.reports-panel{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:32px}
.reports-panel table{width:100%;border-collapse:collapse;font-size:12px}
.reports-panel th{padding:10px 16px;background:#f0f4fb;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1.5px solid var(--border)}
.reports-panel td{padding:10px 16px;border-bottom:1px solid #f0f4fb;color:var(--text)}
.reports-panel tr:last-child td{border-bottom:none}
.reports-panel .rn{font-weight:700}
.reports-panel .rv{font-weight:800;color:var(--navy)}
[data-theme='dark'] .reports-panel th{background:#1e293b}
@media (max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function(){
  const t=localStorage.getItem('theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
</head>
<body>
<div class="page">
  <div class="section-title">Overview</div>
  <div class="stats-grid">
    <div class="stat-tile"><div class="tv" id="st-contacts"><span class="spin"></span></div><div class="tl">Total Contacts</div></div>
    <div class="stat-tile"><div class="tv" id="st-pool"><span class="spin"></span></div><div class="tl">In Automation Pool</div></div>
    <div class="stat-tile"><div class="tv" id="st-sent-total"><span class="spin"></span></div><div class="tl">Emails Sent (All Time)</div></div>
    <div class="stat-tile"><div class="tv" id="st-sent-today"><span class="spin"></span></div><div class="tl">Sent Today</div></div>
    <div class="stat-tile"><div class="tv" id="st-opened"><span class="spin"></span></div><div class="tl">Opened</div><div class="td flat" id="st-open-rate"></div></div>
    <div class="stat-tile"><div class="tv" id="st-clicked"><span class="spin"></span></div><div class="tl">Clicked</div><div class="td flat" id="st-click-rate"></div></div>
    <div class="stat-tile"><div class="tv" id="st-failed"><span class="spin"></span></div><div class="tl">Failed Sends</div></div>
    <div class="stat-tile"><div class="tv" id="st-unsub"><span class="spin"></span></div><div class="tl">Unsubscribed</div></div>
  </div>

  <div class="section-title">Reports</div>
  <div class="reports-panel">
    <table>
      <thead><tr><th>Metric</th><th>Value</th></tr></thead>
      <tbody id="reports-body">
        <tr><td class="rn">Automation engine</td><td class="rv" id="rp-engine">…</td></tr>
        <tr><td class="rn">Pool — active</td><td class="rv" id="rp-pool-active">…</td></tr>
        <tr><td class="rn">Pool — completed</td><td class="rv" id="rp-pool-done">…</td></tr>
        <tr><td class="rn">Last automation run</td><td class="rv" id="rp-last-run">…</td></tr>
        <tr><td class="rn">Email API</td><td class="rv" id="rp-api-status">…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SB='https://oagsgovnxgiszofgytre.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hZ3Nnb3ZueGdpc3pvZmd5dHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzA1MjgsImV4cCI6MjA5NjEwNjUyOH0.V3eNIE3PXAcMuS3Gv0tBb3kqjVRAI25tSj8ED5W7vmI';
const H={apikey:KEY,Authorization:`Bearer ${KEY}`,Prefer:'count=exact'};
const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
async function countOf(path){
  try{
    const r=await fetch(`${SB}/rest/v1/${path}`,{headers:{...H,'Range':'0-0'}});
    return Number(r.headers.get('content-range')?.split('/')?.[1]||0);
  }catch{return null;}
}
function fmt(n){return n===null?'—':n.toLocaleString();}
function pct(n,d){return d?((n/d)*100).toFixed(1)+'%':'—';}

async function loadStats(){
  const todayIST=new Date(Date.now()+330*60000).toISOString().split('T')[0];
  const todayStartUTC=new Date(todayIST+'T00:00:00+05:30').toISOString();

  const [contacts, poolTotal, poolActive, poolDone, sentTotal, sentToday, opened, clicked, failed, unsub] = await Promise.all([
    countOf('email_contacts?select=id'),
    countOf('email_automation_pool?select=id'),
    countOf('email_automation_pool?select=id&status=eq.active'),
    countOf('email_automation_pool?select=id&status=eq.completed'),
    countOf('email_sends?select=id&status=eq.sent'),
    countOf(`email_sends?select=id&status=eq.sent&sent_at=gte.${encodeURIComponent(todayStartUTC)}`),
    countOf('email_sends?select=id&opened_at=not.is.null'),
    countOf('email_sends?select=id&clicked_at=not.is.null'),
    countOf('email_sends?select=id&status=eq.failed'),
    countOf('email_unsubscribes?select=email'),
  ]);

  set('st-contacts', fmt(contacts));
  set('st-pool', fmt(poolTotal));
  set('st-sent-total', fmt(sentTotal));
  set('st-sent-today', fmt(sentToday));
  set('st-opened', fmt(opened));
  set('st-clicked', fmt(clicked));
  set('st-failed', fmt(failed));
  set('st-unsub', fmt(unsub));
  set('st-open-rate', sentTotal ? `${pct(opened,sentTotal)} open rate` : '');
  set('st-click-rate', sentTotal ? `${pct(clicked,sentTotal)} click rate` : '');

  set('rp-pool-active', fmt(poolActive));
  set('rp-pool-done', fmt(poolDone));

  try{
    const r=await fetch(`${SB}/rest/v1/email_automation_state?select=status,last_run_at&id=eq.default`,{headers:H});
    const d=await r.json();
    const s=d && d[0];
    set('rp-engine', s ? (s.status==='running' ? '🟢 Running' : '🔴 Stopped') : '—');
    set('rp-last-run', s && s.last_run_at ? new Date(s.last_run_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}) : '—');
  }catch{ set('rp-engine','—'); set('rp-last-run','—'); }

  try{
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('/api/email/health',{signal:ctrl.signal});const d=await r.json();
    set('rp-api-status', d.live?'🟢 Live':'🔴 Down');
  }catch{ set('rp-api-status','🔴 Down'); }
}
window.onload=loadStats;
</script>
</body>
</html>
